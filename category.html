<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品分类 - 香蜜闺秀</title>
  <link rel="icon" href="goso_img/favicon.ico">
  <link rel="stylesheet" href="css/common.css">
</head>
<body>
  <nav class="top-nav">
    <img src="goso_img/logo.jpg" alt="香蜜闺秀" class="logo">
    <div class="cart-btn" onclick="navigateTo('cart')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <path d="M16 10a4 4 0 0 1-8 0"></path>
      </svg>
      <span class="badge" style="display: none;">0</span>
    </div>
  </nav>

  <div class="category-layout" style="margin-top: 48px; margin-bottom: 56px;">
    <div class="category-sidebar">
      <div class="sidebar-item active" data-category="文胸">文胸</div>
      <div class="sidebar-item" data-category="家居服">家居服</div>
      <div class="sidebar-item" data-category="内裤">内裤</div>
      <div class="sidebar-item" data-category="保暖衣">保暖衣</div>
    </div>

    <div class="category-main">
      <div class="category-search">
        <div class="search-input-wrapper">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input type="text" class="search-input" placeholder="搜索商品名称" id="search-input">
        </div>
        <button class="search-btn-action" onclick="searchProducts()">搜索</button>
      </div>

      <div class="filter-bar">
        <button class="filter-btn active" data-sort="default">综合排序</button>
        <button class="filter-btn" data-sort="price-asc">价格从低到高</button>
        <button class="filter-btn" data-sort="price-desc">价格从高到低</button>
        <button class="filter-btn" data-sort="sales">销量优先</button>
      </div>

      <div class="product-grid" id="product-list">
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item" data-page="index" onclick="navigateTo('index')">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span class="text">首页</span>
    </div>
    <div class="nav-item active" data-page="category" onclick="navigateTo('category')">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
      </svg>
      <span class="text">分类</span>
    </div>
    <div class="nav-item" data-page="cart" onclick="navigateTo('cart')">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <path d="M16 10a4 4 0 0 1-8 0"></path>
      </svg>
      <span class="text">购物车</span>
    </div>
    <div class="nav-item" data-page="member" onclick="navigateTo('member')">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span class="text">我的</span>
    </div>
  </nav>

  <script src="js/common.js"></script>
  <script>
    let currentCategory = '文胸';
    let currentSort = 'default';
    let currentSearch = '';

    document.addEventListener('DOMContentLoaded', function() {
      loadProducts(currentCategory);
      setupEventListeners();
    });

    function setupEventListeners() {
      document.querySelectorAll('.sidebar-item').forEach(item => {
        item.addEventListener('click', function() {
          document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
          this.classList.add('active');
          currentCategory = this.dataset.category;
          loadProducts(currentCategory);
        });
      });

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          currentSort = this.dataset.sort;
          loadProducts(currentCategory);
        });
      });

      document.getElementById('search-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          searchProducts();
        }
      });
    }

    function searchProducts() {
      currentSearch = document.getElementById('search-input').value.trim();
      loadProducts(currentCategory);
    }

    function loadProducts(category) {
      const productList = document.getElementById('product-list');
      const allProducts = getAllProducts();
      
      let filteredProducts = allProducts.filter(product => product.category === category);
      
      if (currentSearch) {
        filteredProducts = filteredProducts.filter(product => 
          product.name.includes(currentSearch)
        );
      }

      switch(currentSort) {
        case 'price-asc':
          filteredProducts.sort((a, b) => a.price - b.price);
          break;
        case 'price-desc':
          filteredProducts.sort((a, b) => b.price - a.price);
          break;
        case 'sales':
          filteredProducts.sort((a, b) => (b.sales || 0) - (a.sales || 0));
          break;
      }

      productList.innerHTML = '';
      
      if (filteredProducts.length === 0) {
        productList.innerHTML = '<div class="empty-state">暂无商品</div>';
        return;
      }

      filteredProducts.forEach(product => {
        const productCard = document.createElement('div');
        productCard.className = 'product-card';
        
        const hasActivity = Math.random() < 0.7;
        const activityTag = hasActivity ? `<span class="activity-tag">${getActivityTag(product.category)}</span>` : '';
        
        productCard.innerHTML = `
          <div class="product-image-wrapper">
            <img src="${product.image}" alt="${product.name}" class="product-image">
            ${activityTag}
          </div>
          <div class="product-info">
            <div class="product-name">${product.name}</div>
            <div class="product-bottom">
              <div class="product-price">¥${product.price.toFixed(2)}</div>
              <button class="buy-btn" onclick="event.stopPropagation(); addToCart('${product.id}')">立即购买</button>
            </div>
          </div>
        `;
        productCard.addEventListener('click', () => showToast('商品详情功能开发中'));
        productList.appendChild(productCard);
      });
    }

    function getActivityTag(category) {
      const tags = {
        '文胸': '99元3件',
        '家居服': '买一送一',
        '内裤': '买三送二',
        '保暖衣': '满199减50'
      };
      return tags[category] || '热销';
    }

    function addToCart(productId) {
      const product = getAllProducts().find(p => p.id === productId);
      if (product) {
        addToCartCommon(product);
        showToast('已添加到购物车');
      }
    }
  </script>
</body>
</html>
