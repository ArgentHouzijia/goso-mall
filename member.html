  <script src="js/common.js"></script>
  <script>
    let countdownTime = 24 * 60 * 60 - 1;

    function updateCountdown() {
      const hours = Math.floor(countdownTime / 3600);
      const minutes = Math.floor((countdownTime % 3600) / 60);
      const seconds = countdownTime % 60;
      document.getElementById('coupon-countdown').textContent = 
        `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      
      if (countdownTime > 0) {
        countdownTime--;
      } else {
        countdownTime = 24 * 60 * 60 - 1;
      }
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    function toggleSigninModal() {
      const modal = document.getElementById('signin-modal');
      const btn = document.getElementById('signin-float-btn');
      if (modal.style.display === 'flex') {
        modal.style.display = 'none';
        btn.style.transform = 'rotate(0deg)';
      } else {
        modal.style.display = 'flex';
        btn.style.transform = 'rotate(45deg)';
        generateCalendar();
      }
    }

    function generateCalendar() {
      const calendar = document.getElementById('signin-calendar');
      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth();
      const day = today.getDate();
      
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      
      const signedDays = [1, 2, 3, 4, 5, 6, 7];
      
      let calendarHTML = '<div class="calendar-header">';
      calendarHTML += '<div class="calendar-day">日</div>';
      calendarHTML += '<div class="calendar-day">一</div>';
      calendarHTML += '<div class="calendar-day">二</div>';
      calendarHTML += '<div class="calendar-day">三</div>';
      calendarHTML += '<div class="calendar-day">四</div>';
      calendarHTML += '<div class="calendar-day">五</div>';
      calendarHTML += '<div class="calendar-day">六</div>';
      calendarHTML += '</div>';
      
      calendarHTML += '<div class="calendar-body">';
      
      for (let i = 0; i < firstDay; i++) {
        calendarHTML += '<div class="calendar-cell empty"></div>';
      }
      
      for (let d = 1; d <= daysInMonth; d++) {
        const isSigned = signedDays.includes(d);
        const isToday = d === day;
        let className = 'calendar-cell';
        if (isSigned) className += ' signed';
        if (isToday) className += ' today';
        
        calendarHTML += `<div class="${className}">${d}</div>`;
      }
      
      calendarHTML += '</div>';
      calendar.innerHTML = calendarHTML;
    }

    function doSignin() {
      const btn = document.getElementById('signin-btn');
      if (btn.textContent === '立即签到') {
        btn.textContent = '已签到';
        btn.disabled = true;
        showToast('签到成功！获得10GOSO币');
      }
    }
  </script>
